# ---------- Server ----------
server.port=8081

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/student_complaint_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
# Tables are created by database/student_complaint_management.sql, so Hibernate must not change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Secret must be at least 32 characters long
jwt.secret=StudentComplaintManagementSecretKey2026ForCollegeProject
# 24 hours in milliseconds
jwt.expiration-ms=86400000
